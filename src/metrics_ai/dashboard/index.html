<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metrics.ai ledger</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#ffffff; --line:#e3e3de; --accent:#2f6fde; --mem:#d9822b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --fg:#ecece8; --muted:#a3a39c; --card:#1f1f1d; --line:#33332f; --accent:#6b9cff; --mem:#f0a35a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0; }
  .card h2 { font-size:14px; margin:0 0 12px; }
  .chart { position:relative; height:280px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  pre { white-space:pre-wrap; margin:0; font:12px/1.45 ui-monospace, monospace; }
  .scroll { overflow-x:auto; }
  code { font:12px ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>metrics.ai ledger</h1>
  <p class="sub" id="summary">Loading /api/ledger…</p>
  <div class="grid">
    <section class="card"><h2>Mean latency per run (ms) · Chart.js</h2><div class="chart"><canvas id="latencyChart"></canvas></div></section>
    <section class="card"><h2>Peak RSS per run (MB) · CanvasJS</h2><div class="chart" id="memoryChart"></div></section>
  </div>
  <section class="card" style="margin-top:16px"><h2>Telemetry runs</h2><div class="scroll"><table id="runs"><thead><tr>
    <th>Commit</th><th>Command</th><th>Latency (ms)</th><th>Peak RSS (MB)</th><th>Exit</th></tr></thead><tbody></tbody></table></div></section>
  <section class="card" style="margin-top:16px"><h2>Synthesized impacts</h2><div class="scroll"><table id="impacts"><thead><tr>
    <th>Δ</th><th>Format</th><th>Role</th><th>Jev worth</th><th>Faithful</th><th>Model</th><th>Output</th></tr></thead><tbody></tbody></table></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
<script>
  const short = (s) => (s || "").slice(0, 7);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  function cell(tr, text, cls) {
    const td = document.createElement("td");
    if (cls) td.className = cls;
    if (text instanceof Node) td.appendChild(text); else td.textContent = text;
    tr.appendChild(td);
  }
  const fmt = (v) => (v === null || v === undefined) ? "—" : Number(v).toFixed(1);

  fetch("/api/ledger").then((r) => r.json()).then((data) => {
    const runs = data.telemetry_runs;
    const labels = runs.map((r) => short(r.commit_sha) + " · " + r.command.slice(0, 24));
    document.getElementById("summary").textContent =
      data.commits.length + " commits · " + runs.length + " telemetry runs · " +
      data.synthesized_impacts.length + " synthesized impacts";

    new Chart(document.getElementById("latencyChart").getContext("2d"), {
      type: "bar",
      data: { labels, datasets: [{ label: "Mean latency (ms)", data: runs.map((r) => r.mean_latency_ms),
              backgroundColor: css("--accent"), borderRadius: 4 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } },
                 scales: { x: { ticks: { color: css("--muted") } }, y: { ticks: { color: css("--muted") } } } }
    });

    const memoryChart = new CanvasJS.Chart("memoryChart", {
      backgroundColor: "transparent", animationEnabled: true,
      axisX: { labelFontColor: css("--muted"), labelFontSize: 11 },
      axisY: { labelFontColor: css("--muted"), gridColor: css("--line"), suffix: " MB" },
      data: [{ type: "column", color: css("--mem"),
               dataPoints: runs.map((r, i) => ({ label: labels[i], y: r.peak_memory_mb })) }]
    });
    memoryChart.render();

    const runBody = document.querySelector("#runs tbody");
    runs.forEach((r) => {
      const tr = document.createElement("tr");
      cell(tr, short(r.commit_sha)); cell(tr, r.command);
      cell(tr, fmt(r.mean_latency_ms), "num"); cell(tr, fmt(r.peak_memory_mb), "num"); cell(tr, String(r.exit_code), "num");
      runBody.appendChild(tr);
    });

    const impBody = document.querySelector("#impacts tbody");
    data.synthesized_impacts.forEach((i) => {
      const tr = document.createElement("tr");
      const pre = document.createElement("pre"); pre.textContent = i.output_text || "(halted)";
      cell(tr, short(i.baseline_sha) + "→" + short(i.target_sha)); cell(tr, i.format_type); cell(tr, i.role);
      cell(tr, i.jev_worth_prob === null ? "—" : Number(i.jev_worth_prob).toFixed(3), "num");
      cell(tr, i.jev_faithful_prob === null ? "—" : Number(i.jev_faithful_prob).toFixed(2), "num");
      cell(tr, i.model_used || "—"); cell(tr, pre);
      impBody.appendChild(tr);
    });
  }).catch((err) => { document.getElementById("summary").textContent = "Failed to load ledger: " + err; });
</script>
</body>
</html>
