[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "metrics-ai"
version = "0.1.0"
description = "Local-first developer telemetry, benchmarking, and empirical impact synthesis engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "gitpython>=3.1.40",
    "radon>=6.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
]

[project.scripts]
metrics = "metrics_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/metrics_ai/dashboard/index.html" = "metrics_ai/dashboard/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
